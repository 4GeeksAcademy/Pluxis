
services:
  - type: web
    name: pluxis-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: chmod +x render_build.sh && ./render_build.sh
    startCommand: pipenv run gunicorn wsgi:application --chdir src
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: pluxis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: FRONTEND_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"

databases:
  - name: pluxis-db
    region: frankfurt
    plan: free
